<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>St John of Jerusalem Eye Hospital Group</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <!-- for icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body class="font-['Montserrat',sans-serif]">
    <!--  -->
    <header class="w-full">
        <!-- Top Announcement Bar -->
        <div class="bg-black text-white text-xs font-semibold py-2.5 px-4 sm:px-8">
            <div class="max-w-7xl mx-auto flex items-center justify-between">
                <button class="p-1 text-gray-400 hover:text-white transition cursor-pointer" aria-label="Previous announcement">
                    <i class="ri-arrow-left-line text-lg"></i>
                </button>

                <div class="flex flex-col sm:flex-row items-center gap-2 sm:gap-4 text-center">
                    <p class="tracking-wide">Gaza is still in crisis - find out more about our appeal.</p>
                    <button class="bg-[#d9222a] hover:bg-[#b51b22] text-white px-4 py-1.5 rounded-full font-bold uppercase tracking-wider text-[11px] transition duration-200 shadow-sm cursor-pointer whitespace-nowrap">
                        DONATE TO THE APPEAL
                    </button>
                </div>

                <button class="p-1 text-gray-400 hover:text-white transition cursor-pointer" aria-label="Next announcement">
                    <i class="ri-arrow-right-line text-lg"></i>
                </button>
            </div>
        </div>

        <!-- Main Navigation Bar -->
        <div class=" border-b border-gray-200 py-3 px-4 sm:px-8 bg-[#FAB914]">
            <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
                <!-- Logos -->
                <a href="#" class="flex items-center gap-3 flex-shrink-0 hover:opacity-90 transition">
                    <img src="assets/logo-icon.svg" alt="St John Eye Hospital Logo" class="h-10 w-auto">
                    <img src="assets/logoName.svg" alt="St John of Jerusalem Eye Hospital Group" class="h-7 sm:h-8 w-auto">
                </a>

                <!-- Search Input -->
                <div class="relative w-full max-w-xs sm:max-w-sm md:max-w-md">
                    <input 
                        type="text" 
                        placeholder="Search for anything..." 
                        class="w-full pl-4 pr-10 py-2 rounded bg-white border border-gray-300 text-sm text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-black focus:border-transparent transition"
                    >
                    <div class="absolute right-0 top-1/2 -translate-y-1/2 bg-[#E54113]  text-white px-2 py-1 pointer-events-none flex items-center">
                        <i class="ri-search-line text-lg"></i>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <script src="script.js"></script>
</body>

</html>
